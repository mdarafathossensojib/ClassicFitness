<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
        <tr>
            <td align="center">
                <table width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:10px; padding:40px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                    
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <h2 style="margin:0; color:#111827;">🔐 Password Reset</h2>
                        </td>
                    </tr>

                    <tr>
                        <td style="color:#374151; font-size:15px; line-height:1.6;">
                            <p style="margin:0 0 15px 0;">
                                Hello <strong>{{ user.first_name }} {{ user.last_name }}</strong>,
                            </p>

                            <p style="margin:0 0 20px 0;">
                                We received a request to reset your password. Click the button below to set a new password.
                            </p>

                            <div style="text-align:center; margin:30px 0;">
                                <a href="{{ protocol }}://{{ domain }}/forgot-password/{{ uid }}/{{ token }}"
                                   style="background-color:#dc2626; color:#ffffff; padding:12px 25px; text-decoration:none; border-radius:6px; font-weight:bold; display:inline-block;">
                                    Reset Password
                                </a>
                            </div>

                            <p style="font-size:13px; color:#6b7280;">
                                If you did not request this, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding-top:30px; font-size:12px; color:#9ca3af;">
                            © 2026 Classic Fitness. All rights reserved.
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
